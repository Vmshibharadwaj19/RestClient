spring:
  application:
    name: ecom

  datasource:
    url: jdbc:mysql://localhost:3306/product_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  main:
    banner-mode: OFF

server:
  port: 8081

logging:
  level:
    root: INFO
    com.ecom.ecom: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

  file:
    name: logs/application.log

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] - %msg%n"

  logback:
    rollingpolicy:
      file-name-pattern: "logs/application.%d{yyyy-MM-dd}.%i.log.gz"
      max-file-size: 10MB
      max-history: 30