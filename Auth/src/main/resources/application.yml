spring:
  application:
    name: Auth
  security:
    user:
      name: user
      password: user
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db
    username: root
    password: root


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8085

logging:
  file:
    name: logs/application.log

  logback:
    rollingpolicy:
      file-name-pattern: /inventory-service/logs/application.%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30

  level:
    root: INFO
    com.Ecom.inventory_service: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

jwt:
  secret: "my-super-secret-key-for-jwt-authentication-123456789"